<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire FE — STCS</title>
<style>
:root{
  --blue:#1F5C99;
  --blue-dark:#164873;
  --blue-pale:#EAF1F8;
  --orange:#FCE4D6;
  --orange-line:#E8A87C;
  --grey:#D9D9D9;
  --grey-line:#BFBFBF;
  --ink:#1E2530;
  --ink-soft:#5B6472;
  --paper:#FFFFFF;
  --bg:#F3F5F8;
  --ok:#2E7D32;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--blue);
  color:#fff;
  display:flex; align-items:center; gap:14px;
  padding:10px 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.topbar .logo{font-weight:800; letter-spacing:.5px; font-size:15px;}
.topbar .logo small{display:block; font-weight:400; font-size:9px; letter-spacing:1.5px; opacity:.8;}
.topbar .title{font-size:13px; opacity:.92; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .progress-wrap{display:flex; align-items:center; gap:8px; font-size:12px;}
.progress-track{width:110px; height:6px; background:rgba(255,255,255,.25); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:#fff; border-radius:4px; transition:width .25s ease;}
.mode-toggle{display:flex; background:rgba(255,255,255,.15); border-radius:8px; padding:2px; gap:2px;}
.mode-toggle button{
  border:none; background:transparent; color:#fff; padding:7px 14px; border-radius:6px;
  font-size:12.5px; font-weight:600; opacity:.75;
}
.mode-toggle button.active{background:#fff; color:var(--blue); opacity:1;}
.iconbtn{
  border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff;
  border-radius:6px; padding:7px 11px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.iconbtn:hover{background:rgba(255,255,255,.15);}

/* ===== Audio / Microphone ===== */
.field-with-audio{display:flex; gap:8px; align-items:flex-start;}
.field-with-audio .field{flex:1;}
.audio-btn{
  border:1px solid #D4D9E0; background:#fff; color:var(--blue-dark); border-radius:8px;
  padding:9px 12px; font-size:18px; cursor:pointer; flex:none; height:fit-content;
  margin-top:22px; transition:all .15s ease; display:flex; align-items:center; justify-content:center;
  min-width:40px; min-height:40px;
}
.audio-btn:hover{background:var(--blue-pale); border-color:var(--blue);}
.audio-btn:active{background:var(--blue); color:#fff;}
.audio-btn.recording{
  background:var(--blue); color:#fff; animation:pulse 0.6s infinite;
  border-color:var(--blue);
}
.audio-btn.unsupported{opacity:.4; cursor:not-allowed;}
.audio-btn.error{background:#ffebee; color:#B3261E; border-color:#E8A8A2;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(31,92,153,.7);}
  70%{box-shadow:0 0 0 8px rgba(31,92,153,0);}
  100%{box-shadow:0 0 0 0 rgba(31,92,153,0);}
}
.audio-hint{font-size:10.5px; color:var(--ink-soft); margin-top:4px; min-height:18px;}

/* ===== Layout ===== */
.shell{display:flex; max-width:1500px; margin:0 auto; min-height:calc(100vh - 52px);}
.nav{
  width:250px; flex:none; background:var(--paper); border-right:1px solid #E4E8ED;
  padding:14px 10px; position:sticky; top:52px; height:calc(100vh - 52px); overflow-y:auto;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; margin-bottom:2px;
  font-size:12.8px; color:var(--ink-soft); cursor:pointer; border:1px solid transparent;
}
.nav-item:hover{background:var(--blue-pale);}
.nav-item.active{background:var(--blue-pale); color:var(--blue-dark); font-weight:700; border-color:#CFE0F0;}
.nav-num{
  width:20px; height:20px; border-radius:50%; background:var(--grey); color:#697080;
  font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
}
.nav-item.done .nav-num{background:var(--ok); color:#fff;}
.nav-item.active .nav-num{background:var(--blue); color:#fff;}

.main{flex:1; min-width:0; padding:26px 30px 80px;}
.panel{display:none;}
.panel.active{display:block;}

/* ===== Form styling ===== */
.card{
  background:var(--paper); border:1px solid #E4E8ED; border-radius:12px;
  padding:22px 24px; margin-bottom:18px;
}
.card h2{
  margin:0 0 4px; font-size:18px; color:var(--blue-dark); font-weight:800;
}
.card .hint{margin:0 0 18px; font-size:12.5px; color:var(--ink-soft);}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 18px;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g1{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12px; font-weight:700; color:var(--ink);}
.field .sub{font-weight:400; color:var(--ink-soft); font-size:11px;}
.field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
  border:1px solid #D4D9E0; border-radius:8px; padding:9px 11px; font-size:13.5px; color:var(--ink);
  background:#FBFCFE; width:100%;
}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none; border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px var(--blue-pale);
}
.field textarea{resize:vertical; min-height:64px; line-height:1.45;}
.field .counter{font-size:10.5px; color:var(--ink-soft); text-align:right;}
.field .counter.over{color:#B3261E; font-weight:700;}

.subgrid-title{font-size:12.5px; font-weight:800; color:var(--blue-dark); margin:20px 0 10px; text-transform:uppercase; letter-spacing:.4px;}
.subgrid-title:first-child{margin-top:0;}

.naf-status{
  background:var(--blue-pale); border:1px solid #CFE0F0; border-radius:8px;
  padding:12px 14px; font-size:12.5px; color:var(--ink); margin:14px 0 4px; line-height:1.6;
}
.naf-status.muted{background:#F6F8FA; border-color:#E4E8ED; color:var(--ink-soft); font-style:italic;}

.naf-badge{
  display:inline-block; background:var(--orange); color:#7A3B1D; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle;
}

.spec-btn{
  display:inline-block; padding:6px 12px; background:#1F5C99; color:#fff; border:none;
  border-radius:6px; font-size:11px; font-weight:600; cursor:pointer;
  transition:background .2s ease, transform .1s ease;
}
.spec-btn:hover{ background:#0d3a66; transform:translateY(-1px); }
.spec-btn:active{ transform:translateY(0); }

/* mini table forms (fonctionnement, effectifs, sinistralite, horaires, locaux) */
.mtable{width:100%; border-collapse:collapse; margin-bottom:6px;}
.mtable th{
  background:var(--grey); color:var(--ink); font-size:11px; text-align:left; padding:8px 9px;
  border:1px solid #C9CED6; font-weight:700;
}
.mtable td{border:1px solid #E1E5EA; padding:6px 7px; vertical-align:middle;}
.mtable td.label{background:#F6F8FA; font-weight:700; font-size:12px; white-space:nowrap;}
.mtable input, .mtable select{
  width:100%; border:1px solid #D4D9E0; border-radius:6px; padding:6px 7px; font-size:12.5px; background:#FBFCFE;
}
.mtable input:focus, .mtable select:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-pale);}
.mtable .total-cell{font-weight:800; text-align:center; background:#F6F8FA;}

/* dynamic row tables (postes, risques) */
.dyn-row{
  border:1px solid #E1E5EA; border-radius:10px; padding:14px; margin-bottom:10px; background:#FBFCFE; position:relative;
}
.dyn-row .row-num{
  position:absolute; top:-9px; left:12px; background:var(--blue); color:#fff; font-size:10px; font-weight:800;
  padding:2px 8px; border-radius:10px;
}
.dyn-row .remove-row{
  position:absolute; top:-9px; right:12px; background:#fff; border:1px solid #E1B0A8; color:#B3261E;
  font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:10px;
}
.add-row-btn{
  border:1.5px dashed #B9C6D6; background:transparent; color:var(--blue-dark); font-weight:700; font-size:12.5px;
  padding:9px 14px; border-radius:8px; width:100%; margin-top:4px;
}
.add-row-btn:hover{background:var(--blue-pale);}

.risk-quickset{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.risk-chip{
  border:1px solid #CFE0F0; background:var(--blue-pale); color:var(--blue-dark); font-size:11px; font-weight:600;
  padding:5px 10px; border-radius:14px;
}
.risk-chip:hover{background:var(--blue); color:#fff;}

.nav-footer{
  display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px;
}
.navbtn{
  border:1px solid #D4D9E0; background:#fff; color:var(--ink); font-weight:700; font-size:13px;
  padding:10px 18px; border-radius:8px;
}
.navbtn.primary{background:var(--blue); color:#fff; border-color:var(--blue);}
.navbtn:hover{filter:brightness(0.97);}
.navbtn:disabled{opacity:.4; cursor:default;}

/* ===== Preview ===== */
.preview-wrap{max-width:900px; margin:0 auto; padding:26px 20px 90px;}
.doc-toolbar{
  display:flex; justify-content:flex-end; gap:10px; margin-bottom:16px;
}
.doc-btn{
  border:1px solid var(--blue); background:var(--blue); color:#fff; font-weight:700; font-size:12.5px;
  padding:10px 16px; border-radius:8px; display:flex; align-items:center; gap:7px;
}
.doc-btn.secondary{background:#fff; color:var(--blue);}
.doc-btn:hover{filter:brightness(0.95);}

.sheet{
  background:#fff; border:1px solid #E1E5EA; box-shadow:0 1px 3px rgba(20,30,50,.06);
  padding:34px 38px; margin-bottom:22px; border-radius:2px;
}
.sheet-legal{font-style:italic; font-size:10.5px; text-decoration:underline; color:#333; margin-bottom:14px;}
.banner{display:flex; border:1px solid var(--grey-line); margin-bottom:20px;}
.banner .logo-cell{
  width:32%; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:1px solid var(--grey-line); padding:10px;
}
.banner .logo-cell b{color:var(--ok); font-size:19px; letter-spacing:1px;}
.banner .logo-cell span{color:var(--ok); font-size:8px; letter-spacing:1.5px;}
.banner .doc-cell{flex:1; display:flex; flex-direction:column;}
.banner .doc-cell .r1{background:var(--blue); color:#fff; text-align:center; font-weight:800; font-size:13px; padding:8px; letter-spacing:.5px;}
.banner .doc-cell .r2{text-align:center; font-weight:800; font-size:17px; padding:9px; border-top:1px solid var(--grey-line);}
.sheet-title{text-align:center; color:var(--blue-dark); font-weight:800; font-size:21px; margin:18px 0 4px;}
.sheet-sub{text-align:center; font-size:13px; color:#333; margin-bottom:18px;}
.p1-cols{display:flex; gap:20px; margin-bottom:16px;}
.p1-cols .left{flex:1; font-size:12.5px; line-height:1.9;}
.p1-cols .photobox{width:150px; height:100px; border:1px solid var(--grey-line); flex:none;}
.visit-block{font-size:12.5px; line-height:1.85; margin-bottom:14px;}
.visit-block .vt{font-weight:700; margin-bottom:2px;}
.visit-block .vi{padding-left:16px;}
.desc-block{font-size:12.5px; margin-bottom:16px;}
.desc-block .dt{font-weight:700; margin-bottom:4px;}
.preco-box{border-top:2px solid var(--blue); border-bottom:2px solid var(--blue); padding:12px 0; margin-bottom:4px;}
.preco-box h3{color:var(--blue-dark); font-size:13.5px; margin:0 0 10px;}
.preco-item{background:var(--orange); font-size:12px; padding:8px 10px; margin-bottom:5px; border-radius:2px; line-height:1.5;}

.psec h3{
  color:var(--blue-dark); font-size:14px; border-bottom:2px solid var(--blue); padding-bottom:6px; margin:22px 0 10px;
}
.psec h4{font-size:12px; margin:12px 0 5px; font-weight:800;}
.psec .pline{font-size:12px; margin:3px 0; padding-left:14px;}
.psec .pcomment{font-size:11.5px; font-style:italic; color:#555; margin:8px 0 0;}
.ptable{width:100%; border-collapse:collapse; font-size:11.5px; margin:6px 0 4px;}
.ptable th{background:var(--grey); border:1px solid #C9CED6; padding:6px 7px; text-align:left; font-weight:700;}
.ptable td{border:1px solid #E1E5EA; padding:6px 7px;}
.ptable td.lbl{background:#F6F8FA; font-weight:700;}
.ptable td.ctr{text-align:center;}
.risk-table th{background:var(--blue); color:#fff;}
.empty-note{color:#9AA2AD; font-style:italic;}
.pagefoot{
  display:flex; justify-content:space-between; font-size:9.5px; color:#8A93A0; border-top:1px solid #E1E5EA;
  padding-top:8px; margin-top:20px;
}

@media (max-width: 980px){
  .nav{display:none;}
  .grid, .grid.g3{grid-template-columns:1fr;}
  .p1-cols{flex-direction:column;}
  .sheet{padding:20px 16px;}
}

@media print{
  .topbar,.nav,.doc-toolbar,.nav-footer{display:none !important;}
  .shell,.main{padding:0; margin:0;}
  .sheet{box-shadow:none; border:none; page-break-after:always;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">STCS<small>PRÉVENTION · SANTÉ · TRAVAIL</small></div>
  <div class="title" id="topTitle">Questionnaire de préparation — Fiche d'Entreprise</div>
  <div class="progress-wrap">
    <span id="progressLabel">0 / 15</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="mode-toggle">
    <button id="btnModeForm" class="active">Formulaire</button>
    <button id="btnModePreview">Aperçu FE</button>
  </div>
  <button class="iconbtn" id="btnReset">Nouvelle fiche</button>
</div>

<div class="shell">
  <nav class="nav" id="navList"></nav>

  <main class="main">
    <div id="formPanels"></div>
  </main>

  <div class="preview-wrap" id="previewWrap" style="display:none;">
    <div class="doc-toolbar">
      <button class="doc-btn secondary" id="btnPrint">🖨️ Imprimer / PDF</button>
      <button class="doc-btn" id="btnExportWord">⬇️ Exporter en Word (.doc)</button>
    </div>
    <div id="previewContent"></div>
  </div>
</div>

<script>
// ===== Constantes =====

const NAV_SECTIONS = [
  { id: 0,  key: 'garde', title: "Page de garde" },
  { id: 1,  key: 's1',    title: "1. Renseignements administratifs" },
  { id: 2,  key: 's2',    title: "2. Fonctionnement de l'entreprise" },
  { id: 3,  key: 's3',    title: "3. Effectifs" },
  { id: 4,  key: 's4',    title: "4. Sinistralité" },
  { id: 5,  key: 's5',    title: "5. Organisation des secours" },
  { id: 6,  key: 's6',    title: "6. Horaires de travail" },
  { id: 7,  key: 's7',    title: "7. Entretien" },
  { id: 8,  key: 's8',    title: "8. Postes de travail" },
  { id: 9,  key: 's9',    title: "9. Ambiance générale" },
  { id: 10, key: 's10',   title: "10. Locaux sociaux" },
  { id: 11, key: 's11',   title: "11. Risques & prévention" },
  { id: 12, key: 's12',   title: "12. Préconisations (conclusion)" },
  { id: 13, key: 's13',   title: "13. Documents remis" },
  { id: 14, key: 's14',   title: "14. Historique" },
];

const OUI_NON_OPTIONS = ["", "Oui", "Non", "Partiel", "Non concerné"];

const RISK_LIST = [
  "Chutes de hauteur",
  "Chutes de plain-pied",
  "Circulation / engins",
  "Manutention manuelle",
  "Gestes répétitifs / TMS",
  "Équipements de travail (machines)",
  "Risque électrique",
  "Risque chimique",
  "Risque biologique",
  "Incendie / explosion",
  "Bruit",
  "Ambiance thermique",
  "Éclairage",
  "Vibrations",
  "Risques psychosociaux (RPS)",
  "Travail sur écran",
  "Coactivité / entreprises extérieures",
  "Risque routier",
];

// ================== BASE DE CONNAISSANCES NAF (préremplissage) ==================
// NB : ces suggestions sont des points de départ génériques par métier-type.
// Elles doivent systématiquement être vérifiées, adaptées et validées lors de la visite
// et par le médecin du travail avant intégration définitive à la FE.
function nr(risque, postes, elements, moyens, conseils) { return { risque, postes, elements, moyens, conseils }; }
function np(intitule, groupe, taches) { return { intitule, groupe, taches, nb: "" }; }

const NAF_PROFILES = {
  metallurgie: {
    postes: [
      np("Régleur sur ligne de traitement", "Production", "Réglage des paramètres de la ligne, contrôle des bains, surveillance du process."),
      np("Agent de traitement de surface", "Production", "Chargement/déchargement des pièces, immersion dans les bains, contrôle visuel."),
      np("Agent de conditionnement et contrôle", "Production", "Conditionnement des pièces traitées, contrôle qualité, étiquetage."),
    ],
    risques: [
      nr("Risque chimique", "Régleur, agent de traitement", "Bains de traitement contenant des produits classés CMR, manipulation manuelle des pièces.", "Ventilation générale, port de gants et lunettes.", "Renforcer la captation à la source (cf. INRS ED 6008 et stcs.fr/risque-chimique)."),
      nr("Risque électrique", "Régleur, technicien de maintenance", "Armoires électriques de commande des lignes de traitement.", "Habilitation électrique du personnel intervenant.", "Vérifier la mise à jour des habilitations électriques (cf. NF C18-510 et stcs.fr)."),
      nr("Chutes de plain-pied", "Ensemble du personnel", "Sols pouvant être rendus glissants par les projections de bains de traitement.", "Nettoyage régulier des sols.", "Mettre en place un revêtement de sol antidérapant en zone de traitement (cf. INRS ED 950)."),
      nr("Manutention manuelle", "Agent de conditionnement", "Port de bacs de pièces métalliques entre postes.", "Aides à la manutention ponctuelles.", "Étudier l'acquisition d'un moyen de manutention mécanisé (cf. INRS ED 6094 et stcs.fr)."),
      nr("Équipements de travail (machines)", "Régleur", "Ligne de traitement automatisée avec zones de convoyage.", "Protecteurs et arrêts d'urgence sur la ligne.", "Vérifier la conformité des protecteurs lors de la prochaine visite périodique (cf. INRS ED 6122)."),
      nr("Bruit", "Ensemble de l'atelier", "Ambiance sonore générée par les convoyeurs et compresseurs.", "Aucun moyen de protection formalisé à ce jour.", "Réaliser un mesurage d'exposition sonore et envisager des protections auditives adaptées (cf. INRS ED 6035)."),
      nr("Ambiance thermique", "Agent de traitement", "Proximité des bains chauffés pouvant générer une ambiance thermique élevée.", "Aération naturelle de l'atelier.", "Étudier une solution de ventilation localisée en période estivale (cf. stcs.fr)."),
      nr("Risques psychosociaux (RPS)", "Ensemble du personnel", "Cadence liée au flux de production.", "Points d'équipe réguliers.", "Vous pouvez vous faire accompagner par le service de prévention pour objectiver la charge de travail (cf. INRS ED 6349)."),
    ],
  },
  construction: {
    postes: [
      np("Maçon", "Production", "Réalisation de fondations, élévation de murs, coffrage et coulage béton."),
      np("Manœuvre de chantier", "Production", "Approvisionnement du chantier, aide aux compagnons, nettoyage de zone."),
      np("Chef d'équipe", "Encadrement", "Organisation du chantier, encadrement de l'équipe, relation client."),
    ],
    risques: [
      nr("Chutes de hauteur", "Maçon, manœuvre", "Travaux en échafaudage ou en étage lors de l'élévation des murs.", "Échafaudages avec garde-corps.", "Vérifier systématiquement la conformité des échafaudages avant usage (cf. INRS ED 6109 et stcs.fr)."),
      nr("Chutes de plain-pied", "Ensemble du personnel", "Sols de chantier encombrés, irréguliers ou boueux.", "Rangement partiel des zones de circulation.", "Organiser le rangement quotidien des zones de circulation (cf. INRS ED 950)."),
      nr("Manutention manuelle", "Maçon, manœuvre", "Port de charges (parpaings, sacs de ciment, matériaux).", "Diable et brouette disponibles.", "Développer l'usage d'aides à la manutention mécanisées (cf. INRS ED 6094)."),
      nr("Gestes répétitifs / TMS", "Maçon", "Gestes répétés de pose et de jointoiement en position contrainte.", "Rotation partielle des tâches.", "Sensibiliser aux gestes et postures, votre service de prévention peut intervenir sur ce sujet (cf. stcs.fr)."),
      nr("Équipements de travail (machines)", "Maçon, manœuvre", "Utilisation de bétonnière, perforateur, meuleuse.", "Formation à l'utilisation des engins.", "Vérifier la mise à jour des vérifications périodiques des équipements (cf. INRS ED 6122)."),

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const fresh = defaultState();
      return Object.assign(fresh, parsed);
    }
  } catch (e) { /* ignore, fallback below */ }
  return defaultState();
}

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

// ================== RECONNAISSANCE VOCALE (WEB SPEECH API) ==================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const SPEECH_SUPPORTED = !!SpeechRecognition;

let currentRecognition = null;

function startSpeechRecognition(bindKey, fieldLabel) {
  if (!SPEECH_SUPPORTED) {
    alert("La reconnaissance vocale n'est pas supportée par votre navigateur. Utilisez Chrome, Edge ou Safari.");
    return;
  }

  const btn = document.querySelector(`[data-audio="${cssEsc(bindKey)}"]`);
  if (!btn) return;

  if (currentRecognition) {
    currentRecognition.abort();
    currentRecognition = null;
    btn.classList.remove("recording");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "fr-FR";
  recognition.continuous = false;
  recognition.interimResults = true;

  btn.classList.add("recording");
  const hint = btn.nextElementSibling;
  if (hint && hint.classList.contains("audio-hint")) {
    hint.textContent = "🎤 Écoute en cours... parlez maintenant (français)";
  }

  recognition.onstart = () => {
    btn.classList.add("recording");
  };

  recognition.onresult = (event) => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    if (event.results[event.results.length - 1].isFinal) {
      const field = document.querySelector(`[data-bind="${cssEsc(bindKey)}"]`);
      if (field) {
        const currentVal = field.value || "";
        const newVal = (currentVal ? currentVal + " " : "") + transcript.trim();
        field.value = newVal;
        setPath(state, bindKey, newVal);
        saveState();
        updateProgress();
        if (field.getAttribute("data-wc")) updateCounter(field);
      }
      if (hint && hint.classList.contains("audio-hint")) {
        hint.textContent = "✅ Dictée OK — cliquez 🎤 pour ajouter plus";
      }
      btn.classList.remove("recording");
      currentRecognition = null;
    }
  };

  recognition.onerror = (event) => {
    const errorMessages = {
      "network": "Erreur réseau — vérifiez votre connexion",
      "not-allowed": "Microphone refusé — vérifiez les permissions",
      "no-speech": "Pas de parole détectée — parlez plus fort",
    };
    const msg = errorMessages[event.error] || `Erreur: ${event.error}`;
    if (hint && hint.classList.contains("audio-hint")) {
      hint.textContent = `❌ ${msg}`;
    }
    btn.classList.remove("recording");
    btn.classList.add("error");
    setTimeout(() => btn.classList.remove("error"), 2000);
    currentRecognition = null;
  };

  recognition.onend = () => {
    btn.classList.remove("recording");
    currentRecognition = null;
  };

  currentRecognition = recognition;
  recognition.start();
}

// ================== UTILITAIRES ==================
function esc(s) {
  return (s === undefined || s === null ? "" : String(s))
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function dispVal(v) {
  const s = (v === undefined || v === null) ? "" : String(v).trim();
  return s === "" ? "/" : esc(s);
}
function wordCount(s) {
  s = (s || "").trim();
  if (!s) return 0;
  return s.split(/\s+/).filter(Boolean).length;
}
function getPath(obj, path) {
  const parts = path.split(".");
  let cur = obj;
  for (const p of parts) {
    if (cur === undefined || cur === null) return undefined;
    cur = cur[/^\d+$/.test(p) ? parseInt(p, 10) : p];
  }
  return cur;
}
function setPath(obj, path, val) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const p = /^\d+$/.test(parts[i]) ? parseInt(parts[i], 10) : parts[i];
    if (cur[p] === undefined) cur[p] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[p];
  }
  const last = parts[parts.length - 1];
  cur[/^\d+$/.test(last) ? parseInt(last, 10) : last] = val;
}

// ================== BUILDERS DE CHAMPS ==================
function fld(bindKey, label, opts = {}) {
  const val = getPath(state, bindKey);
  const type = opts.type || "text";
  const sub = opts.sub ? `<span class="sub"> — ${esc(opts.sub)}</span>` : "";
  const audio = opts.audio ? true : false;
  const fieldHtml = `<input type="${type}" data-bind="${bindKey}" value="${esc(val)}" placeholder="${esc(opts.placeholder || "")}">`;
  const audioHtml = audio ? `<button type="button" class="audio-btn" data-audio="${bindKey}" title="Dicter (micros)" onclick="startSpeechRecognition('${bindKey}', '${esc(label)}')" ${!SPEECH_SUPPORTED ? 'disabled' : ''}>🎤</button>` : '';
  const hintHtml = audio ? '<div class="audio-hint"></div>' : '';
  
  if (audio) {
    return `<div class="field-with-audio">
      <div class="field">
        <label>${esc(label)}${sub}</label>
        ${fieldHtml}
        ${hintHtml}
      </div>
      ${audioHtml}
    </div>`;
  }
  return `<div class="field">
    <label>${esc(label)}${sub}</label>
    ${fieldHtml}
  </div>`;
}

function txt(bindKey, label, opts = {}) {
  const val = getPath(state, bindKey);
  const wc = opts.wordLimit ? `data-wc="wc-${bindKey}" data-wcmin="${opts.wordLimit[0]}" data-wcmax="${opts.wordLimit[1]}"` : "";
  const counter = opts.wordLimit ? `<div class="counter" id="wc-${bindKey}">0 mots</div>` : "";
  const sub = opts.sub ? `<span class="sub"> — ${esc(opts.sub)}</span>` : "";
  const audio = opts.audio ? true : false;
  const textareaHtml = `<textarea data-bind="${bindKey}" ${wc} rows="${opts.rows || 3}" placeholder="${esc(opts.placeholder || "")}">${esc(val)}</textarea>`;
  const audioHtml = audio ? `<button type="button" class="audio-btn" data-audio="${bindKey}" title="Dicter (micros)" onclick="startSpeechRecognition('${bindKey}', '${esc(label)}')" ${!SPEECH_SUPPORTED ? 'disabled' : ''}>🎤</button>` : '';
  const hintHtml = audio ? '<div class="audio-hint"></div>' : '';

  if (audio) {
    return `<div class="field-with-audio">
      <div class="field" style="flex:1;">
        <label>${esc(label)}${sub}</label>
        ${textareaHtml}
        ${counter}
        ${hintHtml}
      </div>
      ${audioHtml}
    </div>`;
  }
  return `<div class="field">
    <label>${esc(label)}${sub}</label>
    ${textareaHtml}
    ${counter}
  </div>`;
}

function sel(bindKey, label, options = OUI_NON_OPTIONS) {
  const val = getPath(state, bindKey) || "";
  const opts = options.map(o => `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${o === "" ? "—" : esc(o)}</option>`).join("");
  return `<select data-bind="${bindKey}">${opts}</select>`;
}

function selField(bindKey, label, options = OUI_NON_OPTIONS) {
  return `<div class="field"><label>${esc(label)}</label>${sel(bindKey, label, options)}</div>`;
}

function miniInput(bindKey, type = "text") {
  const val = getPath(state, bindKey);
  return `<input type="${type}" data-bind="${bindKey}" value="${esc(val)}">`;
}

const PANEL_RENDERERS = [panelGarde, panelS1, panelS2, panelS3, panelS4, panelS5, panelS6, panelS7, panelS8, panelS9, panelS10, panelS11, panelS12, panelS13, panelS14];

// ================== RENDU GLOBAL DU FORMULAIRE ==================
function renderNav() {
  const nav = document.getElementById("navList");
  nav.innerHTML = NAV_SECTIONS.map(s => `
    <div class="nav-item ${s.id === currentPanel ? "active" : ""} ${isSectionFilled(s.id) ? "done" : ""}" data-nav="${s.id}">
      <span class="nav-num">${isSectionFilled(s.id) && s.id !== currentPanel ? "✓" : s.id}</span>
      <span>${esc(s.title)}</span>
    </div>`).join("");
  nav.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => goTo(parseInt(el.getAttribute("data-nav"), 10)));
  });
}

function isSectionFilled(id) {
  const keysBySection = {
    0: ["g_codeNAF", "g_libelle", "g_numAdherent", "g_medecin", "g_descriptif", "preco1", "preco2", "preco3"],
    1: ["s1_adresse", "s1_telephone", "s1_cpNom"],
    2: ["s2_cse_on", "s2_cssct_on", "s2_duerp_on"],
    3: ["s3_cdi_f", "s3_cdi_h", "s3_cdd_f", "s3_cdd_h"],
    4: ["s4_registre", "s4_atSans", "s4_atAvec"],
    5: ["s5_alarme", "s5_extincteurs", "s5_trousse"],
    6: ["s6_normal_nb", "s6_equipes_nb", "s6_tempsHebdo"],
    7: ["s7_nettoyagePar", "s7_listeVetements"],
    8: ["s8_fichesEcrites"],
    9: ["s9_description"],
    10: ["s10_vestiaires_disp"],
    11: ["s11_listeProduits"],
    12: ["s12_commentaires"],
    13: ["s13_documents"],
    14: ["s14_historique"],
  };
  const keys = keysBySection[id] || [];
  const flatFilled = keys.some(k => String(getPath(state, k) || "").trim() !== "");
  if (id === 8) return flatFilled || state.postes.some(p => p.intitule.trim() || p.taches.trim());
  if (id === 11) return flatFilled || state.risques.some(r => r.risque.trim() || r.elements.trim());
  return flatFilled;
}

function panelInnerHtml(i) {
  return `${PANEL_RENDERERS[i]()}
      <div class="nav-footer">
        <button class="navbtn" ${i === 0 ? "disabled" : ""} onclick="goTo(${i - 1})">← Précédent</button>
        <span style="font-size:12px;color:var(--ink-soft);">${i + 1} / ${NAV_SECTIONS.length}</span>
        ${i === NAV_SECTIONS.length - 1
          ? `<button class="navbtn primary" onclick="setMode('preview')">Voir l'aperçu FE →</button>`
          : `<button class="navbtn primary" onclick="goTo(${i + 1})">Suivant →</button>`}
      </div>`;
}

function renderPanels() {
  const wrap = document.getElementById("formPanels");
  wrap.innerHTML = NAV_SECTIONS.map((s, i) => `<div class="panel ${i === currentPanel ? "active" : ""}" id="panel-${i}">${panelInnerHtml(i)}</div>`).join("");
  applyWordCounters();
}

// Reconstruit le contenu d'un panneau précis à partir de l'état courant (utilisé quand l'état
// a pu changer pendant que ce panneau n'était pas affiché — ex : préremplissage NAF depuis la page de garde).
function refreshPanel(idx) {
  const el = document.getElementById(`panel-${idx}`);
  if (!el) return;
  el.innerHTML = panelInnerHtml(idx);
  applyWordCounters();
  if (idx === 3) refreshEffectifDisplay();
}

function applyWordCounters() {
  document.querySelectorAll("[data-wc]").forEach(el => updateCounter(el));
}
function updateCounter(el) {
  const id = el.getAttribute("data-wc");
  const min = parseInt(el.getAttribute("data-wcmin"), 10);
  const max = parseInt(el.getAttribute("data-wcmax"), 10);
  const c = wordCount(el.value);
  const target = document.getElementById(id);
  if (!target) return;
  target.textContent = `${c} mots (cible ${min}–${max})`;
  target.className = "counter" + (c > 0 && (c < min || c > max) ? " over" : "");
}

function goTo(idx) {
  currentPanel = Math.max(0, Math.min(NAV_SECTIONS.length - 1, idx));
  setMode("form");
  refreshPanel(currentPanel);

// ================== TOTAUX EFFECTIFS ==================
function computeEffectifs() {
  const n = k => parseInt(state[k], 10) || 0;
  const cdiF = n("s3_cdi_f"), cdiH = n("s3_cdi_h");
  const cddF = n("s3_cdd_f"), cddH = n("s3_cdd_h");
  const intF = n("s3_interim_f"), intH = n("s3_interim_h");
  const appF = n("s3_apprenti_f"), appH = n("s3_apprenti_h");
  return {
    cdi: cdiF + cdiH, cdd: cddF + cddH, interim: intF + intH, apprenti: appF + appH,
    f: cdiF + cddF + intF + appF, h: cdiH + cddH + intH + appH,
    grand: cdiF + cdiH + cddF + cddH + intF + intH + appF + appH,
  };
}
function refreshEffectifDisplay() {
  const table = document.getElementById("effectifTable");
  if (!table) return;
  const t = computeEffectifs();
  Object.keys(t).forEach(k => {
    const cell = table.querySelector(`[data-tot="${k}"]`);
    if (cell) cell.textContent = t[k];
  });
}

// ================== ROWS DYNAMIQUES ==================

function removePoste(i) { state.postes.splice(i, 1); if (!state.postes.length) state.postes.push(freshPoste()); saveState(); rerenderCurrentPanel(); }
function addRisqueFromChip(label) { state.risques.push(Object.assign(freshRisque(), { risque: label })); saveState(); rerenderCurrentPanel(); }
function addRisqueBlank() { state.risques.push(freshRisque()); saveState(); rerenderCurrentPanel(); }
function removeRisque(i) { state.risques.splice(i, 1); if (!state.risques.length) state.risques.push(freshRisque()); saveState(); rerenderCurrentPanel(); }

// ================== PRÉREMPLISSAGE DEPUIS LE CODE NAF ==================
function ensureMinRisques(min) {
  if (state.risques.length >= min) return 0;
  const existingLabels = new Set(state.risques.map(r => r.risque.trim().toLowerCase()).filter(Boolean));
  let added = 0;
  for (const label of RISK_LIST) {
    if (state.risques.length >= min) break;
    if (!existingLabels.has(label.toLowerCase())) {
      state.risques.push(Object.assign(freshRisque(), { risque: label, _source: "naf" }));
      existingLabels.add(label.toLowerCase());
      added++;
    }
  }
  return added;
}

function prefillFromNAF(silent) {
  const code = (state.g_codeNAF || "").trim().toUpperCase();
  if (!code) {
    if (!silent) alert("Renseignez d'abord le code NAF en page de garde (rubrique « Identification »).");
    return;
  }
  const profileKey = resolveNafProfileKey(code);
  const profile = NAF_PROFILES[profileKey] || NAF_PROFILES.default;

  // --- Postes (rubrique 8) ---
  let addedPostes = 0;
  const pristinePostes = state.postes.length === 1 && !state.postes[0].intitule.trim() && !state.postes[0].taches.trim();
  profile.postes.forEach((p, idx) => {
    const exists = state.postes.some(x => x.intitule.trim().toLowerCase() === p.intitule.toLowerCase());
    if (exists) return;
    const newRow = Object.assign(freshPoste(), p, { _source: "naf" });
    if (pristinePostes && addedPostes === 0) { state.postes[0] = newRow; } else { state.postes.push(newRow); }
    addedPostes++;
  });

  // --- Risques (rubrique 11) — au moins 8 au total ---
  let addedRisques = 0;
  const pristineRisques = state.risques.length === 1 && !state.risques[0].risque.trim();
  profile.risques.forEach((r) => {
    const exists = state.risques.some(x => x.risque.trim().toLowerCase() === r.risque.toLowerCase());
    if (exists) return;
    const newRow = Object.assign(freshRisque(), r, { _source: "naf" });
    if (pristineRisques && addedRisques === 0) { state.risques[0] = newRow; } else { state.risques.push(newRow); }
    addedRisques++;
  });
  const addedPad = ensureMinRisques(8);

  state._prefilledFor = code;
  saveState();
  updateProgress();
  renderNav();
  if (currentPanel === 0 || currentPanel === 8 || currentPanel === 11) rerenderCurrentPanel();

  if (!silent) {
    alert(`Suggestions ajoutées : ${addedPostes} poste(s) et ${addedRisques + addedPad} risque(s) (rubrique 11 : ${state.risques.filter(r => r.risque.trim()).length} au total). Chaque ligne est à vérifier, adapter et compléter lors de la visite avant validation par le médecin du travail.`);
  }
}

function maybeAutoPrefillFromNAF() {
  const code = (state.g_codeNAF || "").trim().toUpperCase();
  if (!code || state._prefilledFor === code) return;
  const pristinePostes = state.postes.length === 1 && !state.postes[0].intitule.trim();
  const pristineRisques = state.risques.length === 1 && !state.risques[0].risque.trim();
  if (pristinePostes && pristineRisques) {
    prefillFromNAF(true);
    showToast("💡 Postes et risques préremplis à partir du code NAF — à vérifier sur site (voir rubriques 8 et 11).");
  } else if (currentPanel === 0) {
    rerenderCurrentPanel();
  }
}

// ================== MÉTIERS SPÉCIALISÉS ==================
// Ajoute les postes et risques d'un métier spécialisé (ex. boucher, boulanger) en complément du NAF principal.
function addSpecializedProfile(profileKey) {
  const profile = SPECIALIZED_PROFILES[profileKey];
  if (!profile) return;

  // Ajouter les postes du métier spécialisé
  profile.postes.forEach(p => {
    const exists = state.postes.some(x => x.intitule.trim().toLowerCase() === p.intitule.toLowerCase());
    if (!exists) {
      const newRow = Object.assign(freshPoste(), p, { _source: "specialized" });
      state.postes.push(newRow);
    }
  });

  // Fusionner les risques du métier spécialisé avec les existants (sans doublon sur le label)
  profile.risques.forEach(r => {
    const exists = state.risques.some(x => x.risque.trim().toLowerCase() === r.risque.toLowerCase());
    if (!exists) {
      const newRow = Object.assign(freshRisque(), r, { _source: "specialized" });
      state.risques.push(newRow);
    }
  });

  // Assurer le minimum de 8 risques si besoin
  ensureMinRisques(8);

  saveState();
  updateProgress();
  renderNav();

  // Rafraîchir les panneaux 8 et 11 s'ils sont actuels ou affichés
  refreshPanel(8);
  refreshPanel(11);
  if (currentPanel === 8 || currentPanel === 11) rerenderCurrentPanel();

  showToast(`✅ Métier « ${profileKey.replace(/_/g, " ").toUpperCase()} » ajouté — risques associés intégrés (voir rubrique 11).`);
}

function showToast(msg) {
  let el = document.getElementById("appToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "appToast";
    el.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E2530;color:#fff;padding:12px 18px;border-radius:8px;font-size:12.5px;max-width:min(90vw,480px);box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:999;transition:opacity .3s ease;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 5000);

  const panel = document.getElementById(`panel-${currentPanel}`);

// ================== ÉCOUTEUR GLOBAL (délégation) ==================
document.addEventListener("input", (e) => {
  const key = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (!key) return;
  setPath(state, key, e.target.value);
  document.querySelectorAll(`[data-bind="${cssEsc(key)}"]`).forEach(el => { if (el !== e.target) el.value = e.target.value; });
  saveState();
  updateProgress();
  if (e.target.hasAttribute("data-wc")) updateCounter(e.target);
  if (key.startsWith("s3_")) refreshEffectifDisplay();
  const dynMatch = key.match(/^(postes|risques)\.(\d+)\./);
  if (dynMatch) clearNafBadge(dynMatch[1], parseInt(dynMatch[2], 10));
  renderNav();
});
document.addEventListener("change", (e) => {
  const key = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (!key || e.target.tagName !== "SELECT") return;
  setPath(state, key, e.target.value);
  saveState();
  updateProgress();
  renderNav();
});
// Déclenche le préremplissage automatique quand on quitte le champ Code NAF (blur ne "bubble" pas -> capture)
document.addEventListener("blur", (e) => {
  const key = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (key === "g_codeNAF") maybeAutoPrefillFromNAF();
}, true);
function clearNafBadge(kind, idx) {
  const arr = kind === "postes" ? state.postes : state.risques;
  if (arr[idx] && (arr[idx]._source === "naf" || arr[idx]._source === "specialized")) {
    arr[idx]._source = undefined;
    const nafBadge = document.getElementById(`naf-badge-${kind}-${idx}`);
    const specBadge = document.getElementById(`spec-badge-${kind}-${idx}`);
    if (nafBadge) nafBadge.style.display = "none";
    if (specBadge) specBadge.style.display = "none";
  }
}
function cssEsc(s) { return s.replace(/([.*+?^${}()|[\]\\])/g, "\\$1"); }

function anonymize(name) {
  const s = (name || "").trim();
  if (!s) return "";
  return s.split(/\s+/).map(w => w.charAt(0).toUpperCase() + ".").join(" ");
}

function buildExportHtml() {
  const content = document.getElementById("previewContent").innerHTML;
  const styles = `
    body{font-family:Calibri,Arial,sans-serif;color:#1E2530;}
    .sheet{padding:0 0 26px; margin-bottom:26px; page-break-after:always;}
    .sheet-legal{font-style:italic;font-size:9.5pt;text-decoration:underline;margin-bottom:12px;}
    .banner{width:100%;border:1px solid #BFBFBF;border-collapse:collapse;margin-bottom:16px;}
    .banner td{border:1px solid #BFBFBF;}
    .sheet-title{text-align:center;color:#1F5C99;font-weight:bold;font-size:18pt;margin:14px 0 4px;}
    .sheet-sub{text-align:center;font-size:11pt;margin-bottom:14px;}
    .psec h3{color:#1F5C99;font-size:13pt;border-bottom:2px solid #1F5C99;padding-bottom:5px;margin:18px 0 8px;}
    .psec h4{font-size:11pt;margin:10px 0 4px;}
    .pline{font-size:10.5pt;margin:3px 0 3px 12px;}
    .pcomment{font-size:10pt;font-style:italic;color:#555;margin:6px 0 0;}
    .ptable{width:100%;border-collapse:collapse;font-size:10pt;margin:6px 0;}
    .ptable th{background:#D9D9D9;border:1px solid #BFBFBF;padding:5px 6px;text-align:left;}
    .ptable td{border:1px solid #D9D9D9;padding:5px 6px;}
    .ptable td.lbl{background:#F6F8FA;font-weight:bold;}
    .ptable td.ctr{text-align:center;}
    .risk-table th{background:#1F5C99;color:#fff;}
    .preco-box{border-top:2px solid #1F5C99;border-bottom:2px solid #1F5C99;padding:10px 0;}
    .preco-item{background:#FCE4D6;font-size:10.5pt;padding:7px 9px;margin-bottom:5px;}
    .pagefoot{display:none;}
    .p1-cols{width:100%;}
    .photobox{border:1px solid #BFBFBF;width:150px;height:100px;}
    .empty-note{color:#999;font-style:italic;}
  `;
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>Fiche d'Entreprise</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
  <style>${styles}</style></head>
  <body>${content}</body></html>`;
}

function exportWord() {
  renderPreview();
  const html = buildExportHtml();
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const naf = (state.g_codeNAF || "FE").replace(/[^\w.-]/g, "");
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `FE_${naf}_${today}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ================== INIT ==================
function init() {
  renderNav();
  renderPanels();
  updateProgress();
  refreshEffectifDisplay();

  document.getElementById("btnModeForm").addEventListener("click", () => setMode("form"));
  document.getElementById("btnModePreview").addEventListener("click", () => setMode("preview"));
  document.getElementById("btnPrint").addEventListener("click", () => { renderPreview(); setTimeout(() => window.print(), 100); });
  document.getElementById("btnExportWord").addEventListener("click", exportWord);
  document.getElementById("btnReset").addEventListener("click", () => {
    if (confirm("Démarrer une nouvelle fiche vierge ? Les données actuelles seront perdues (pensez à exporter avant).")) {
      state = defaultState();
      saveState();
      currentPanel = 0;
      renderNav();
      renderPanels();
      updateProgress();
      refreshEffectifDisplay();
      setMode("form");
    }
  });
}

init();
